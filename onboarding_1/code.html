<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>She Ate - Onboarding</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Custom Tailwind Config for Metallic Gold -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandGold: '#D4AF37',
            brandGoldLight: '#F1D592',
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
<!-- Google Fonts for Elegance -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@300;400;600&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-gradients">
    /* Metallic gold gradient effect */
    .bg-metallic-gold {
      background: linear-gradient(135deg, #D4AF37 0%, #F1D592 50%, #B8860B 100%);
    }
    .text-metallic-gold {
      background: linear-gradient(135deg, #D4AF37 0%, #F1D592 50%, #B8860B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* Subtle overlay for the image */
    .hero-overlay {
      background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 70%, rgba(0,0,0,1) 100%);
    }
  </style>
<script defer src="../shared/navigation.js"></script>
</head>
<body class="bg-black text-white font-['Inter'] h-screen overflow-hidden">
<!-- BEGIN: Onboarding Container -->
<main class="relative h-full flex flex-col justify-between" data-purpose="onboarding-screen-1">
<!-- BEGIN: Hero Image Section -->
<section class="absolute inset-0 z-0 h-3/5">
<!-- Image representing premium food curated for 'her' -->
<img alt="Elegant Food Presentation" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCBaqTNWExbLPYSZyn7K4rJXl526U9nkgpac9C_OxYkgPUnWyOvUSXOtIQ9YBANnP1E7VVj_jzyy5AMSSyYKBzNtmnOG218VFJ0E6wQPDJ9t8GtcAulUsPBIRgYKB_uBTqUYAGC0at6KblOaOQRAr6B2mYxCQ8_9riAD-fxLfXJ8Ku5IDeNNv9UnAdgK88nhigu6pQqj3fRfdRghMoIzgFcsD51TIoCk1fPnee10fHOVOvnN0GKF8jffTXqlLONGp15f1TmeujVEU8"/>
<!-- Gradient overlay for text readability -->
<div class="absolute inset-0 hero-overlay"></div>
</section>
<!-- END: Hero Image Section -->
<!-- BEGIN: Content Section -->
<section class="relative z-10 flex-1 flex flex-col justify-end px-8 pb-12">
<!-- Heading Area -->
<div class="mb-6" data-purpose="heading-group">
<h1 class="font-serif text-4xl md:text-5xl font-bold leading-tight text-metallic-gold mb-4">
          Discover Her <br/> Love Language
        </h1>
<p class="text-gray-300 text-lg leading-relaxed max-w-xs">
          Experience the art of gifting through our meticulously curated menus, designed to celebrate her every craving.
        </p>
</div>
<!-- BEGIN: Interaction Area -->
<div class="flex flex-col gap-8" data-purpose="navigation-controls">
<!-- Progress Indicators (Dots) -->
<div class="flex items-center gap-2" data-purpose="step-indicator">
<div class="h-1.5 w-8 rounded-full bg-brandGold"></div> <!-- Active -->
<div class="h-1.5 w-1.5 rounded-full bg-gray-600"></div>
<div class="h-1.5 w-1.5 rounded-full bg-gray-600"></div>
</div>
<!-- Navigation Buttons -->
<div class="flex items-center justify-between">
<button class="text-gray-400 font-medium tracking-wide uppercase text-sm hover:text-white transition-colors">
            Skip
          </button>
<button class="bg-metallic-gold px-10 py-4 rounded-full text-black font-bold flex items-center gap-2 shadow-lg shadow-brandGold/20 active:scale-95 transition-transform" id="next-button">
            Next
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- END: Interaction Area -->
</section>
<!-- END: Content Section -->
</main>
<!-- END: Onboarding Container -->
<script data-purpose="navigation-logic">
    // Simple placeholder for navigation logic
    document.getElementById('next-button').addEventListener('click', () => {
      console.log('Navigating to screen 2...');
    });
  </script>
</body></html>
